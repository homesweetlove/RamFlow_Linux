[package]
name = "ramflow"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "Foreground-first resource orchestrator for Linux: yields background work under pressure and always restores what it changed."
license = "MIT"
repository = "https://github.com/homesweetlove/RamFlow_Linux"
readme = "README.md"
keywords = ["linux", "memory", "psi", "scheduler", "daemon"]
categories = ["command-line-utilities", "os::linux-apis"]

# No third-party crates on purpose: smaller binary, nothing to audit, nothing to download.
[dependencies]

[lib]
name = "ramflow"
path = "src/lib.rs"

[[bin]]
name = "ramflow"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
